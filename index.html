<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Speaking – Sports Programs</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f0f2f5;
            height: 100vh;
            overflow: hidden;
            color: #1a1a2e;
        }

        /* ── Layout ── */
        .layout {
            display: grid;
            grid-template-columns: 22% 1fr 30%;
            height: 100vh;
        }

        /* ── Left: Question List ── */
        .q-list {
            background: #fff;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .q-list-header {
            padding: 22px 20px 14px;
            border-bottom: 1px solid #f0f0f0;
        }

        .topic-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #eef2ff;
            color: #4f46e5;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .topic-name {
            font-size: 18px;
            font-weight: 700;
            color: #111827;
            line-height: 1.3;
        }

        .part-label {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
            font-weight: 500;
        }

        .q-items {
            overflow-y: auto;
            padding: 12px;
            flex: 1;
        }

        .q-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 6px;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .q-item:hover { background: #f5f3ff; }

        .q-item.active {
            background: #4f46e5;
            border-color: #4f46e5;
        }

        .q-num {
            min-width: 22px;
            height: 22px;
            background: #e5e7eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: #6b7280;
            margin-top: 1px;
        }

        .q-item.active .q-num {
            background: rgba(255,255,255,0.25);
            color: #fff;
        }

        .q-text {
            font-size: 13px;
            line-height: 1.5;
            color: #374151;
            font-weight: 500;
        }

        .q-item.active .q-text { color: #fff; }

        /* ── Center: Main ── */
        .main {
            padding: 28px 24px;
            overflow-y: auto;
            background: #f0f2f5;
            min-width: 0;
        }

        .current-q-card {
            background: #fff;
            border-radius: 16px;
            padding: 22px 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-bottom: 16px;
        }

        .q-big {
            font-size: 19px;
            font-weight: 700;
            color: #111827;
            line-height: 1.5;
            margin-bottom: 0;
        }

        .sample-answer-card {
            background: #fff;
            border-radius: 16px;
            padding: 22px 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .answer-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-reveal {
            font-size: 12px;
            font-weight: 600;
            padding: 5px 14px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-show-answer {
            background: #4f46e5;
            color: white;
        }

        .btn-show-answer:hover { background: #4338ca; }

        .btn-reveal-blanks {
            background: #f3f4f6;
            color: #374151;
            border: 1px solid #e5e7eb;
        }

        .btn-reveal-blanks:hover { background: #e5e7eb; }

        .answer-hidden { display: none; }

        .answer-placeholder {
            background: #f9fafb;
            border: 2px dashed #d1d5db;
            border-radius: 10px;
            padding: 24px;
            text-align: center;
            color: #9ca3af;
            font-size: 14px;
        }

        .answer-placeholder p { margin-bottom: 6px; }
        .answer-placeholder span { font-size: 12px; }

        .sample-answer {
            font-size: 14px;
            line-height: 1.7;
            color: #374151;
        }

        .sample-answer mark {
            background: #fef9c3;
            border-radius: 3px;
            padding: 0 2px;
            color: #92400e;
            font-weight: 600;
        }

        .sample-answer .colloc {
            background: #dcfce7;
            border-radius: 3px;
            padding: 0 2px;
            color: #166534;
            font-weight: 600;
        }

        /* ── Blank / Fill-in ── */
        .blank {
            display: inline;
            border-bottom: 2px solid #4f46e5;
            cursor: pointer;
            border-radius: 3px;
            padding: 1px 8px;
            background: #eef2ff;
            color: transparent;
            user-select: none;
            transition: background 0.2s, color 0.2s;
            font-weight: 600;
            white-space: nowrap;
        }

        .blank::after {
            content: '?';
            color: #818cf8;
            font-weight: 700;
            font-size: 12px;
        }

        .blank.revealed {
            background: #fef9c3;
            color: #92400e;
            border-bottom-color: #f59e0b;
        }

        .blank.revealed::after { display: none; }

        .blank.colloc-blank {
            background: #dcfce7;
            border-bottom-color: #22c55e;
        }

        .blank.colloc-blank::after { color: #22c55e; }

        .blank.colloc-blank.revealed {
            background: #dcfce7;
            color: #166534;
            border-bottom-color: #22c55e;
        }

        .legend {
            display: flex;
            gap: 14px;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid #f3f4f6;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: #6b7280;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 2px;
        }

        /* ── Right: Dictionary Panel ── */
        .dict-panel {
            background: #fff;
            border-left: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .dict-header {
            padding: 20px 22px 0;
        }

        .dict-title {
            font-size: 16px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 14px;
        }

        .tab-row {
            display: flex;
            border-bottom: 2px solid #f3f4f6;
        }

        .tab {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: #9ca3af;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }

        .tab.active {
            color: #4f46e5;
            border-bottom-color: #4f46e5;
        }

        .tab-content { display: none; flex: 1; overflow-y: auto; padding: 18px 20px; }
        .tab-content.active { display: block; }

        /* Synonym tab */
        .syn-note {
            background: #fefce8;
            border-left: 3px solid #facc15;
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 12px;
            color: #713f12;
            margin-bottom: 18px;
            line-height: 1.5;
        }

        .syn-group { margin-bottom: 22px; }

        .syn-keyword {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .syn-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
            flex-shrink: 0;
        }

        .syn-word {
            font-size: 14px;
            font-weight: 700;
            color: #dc2626;
        }

        .syn-word-zh {
            font-size: 11px;
            color: #9ca3af;
        }

        .syn-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding-left: 16px;
            margin-bottom: 10px;
        }

        .syn-tag {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #15803d;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .syn-example {
            margin-left: 16px;
            background: #f9fafb;
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 12px;
            line-height: 1.6;
            color: #374151;
        }

        .syn-example em { color: #6b7280; display: block; margin-top: 4px; font-style: normal; }

        /* Phrases tab */
        .phrase-card {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
        }

        .phrase-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .phrase-word {
            font-size: 15px;
            font-weight: 700;
            color: #111827;
        }

        .phrase-pos {
            font-size: 10px;
            background: #f3f4f6;
            color: #6b7280;
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: 600;
            white-space: nowrap;
        }

        .phrase-zh {
            font-size: 12px;
            color: #4f46e5;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .phrase-def {
            font-size: 12px;
            color: #374151;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .phrase-usage {
            background: #f0fdf4;
            border-left: 3px solid #22c55e;
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 11px;
            color: #15803d;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .phrase-ex-label {
            font-size: 10px;
            font-weight: 700;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .phrase-ex {
            font-size: 12px;
            color: #1f2937;
            font-style: italic;
            margin-bottom: 4px;
            line-height: 1.5;
        }

        .phrase-ex-zh {
            font-size: 11px;
            color: #6b7280;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .phrase-actions {
            display: flex;
            gap: 6px;
        }

        .action-btn {
            flex: 1;
            padding: 6px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            color: #6b7280;
            font-weight: 500;
            transition: all 0.15s;
        }

        .action-btn:hover { background: #f3f4f6; color: #374151; }

        /* scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
    </style>
</head>
<body>
<div class="layout">

    <!-- Left -->
    <div class="q-list">
        <div class="q-list-header">
            <div class="topic-chip">📚 All Topics</div>
            <div class="topic-name" id="topicName">IELTS Speaking</div>
            <div class="part-label" id="partLabel">16 questions</div>
        </div>
        <div class="q-items" id="qList"></div>
    </div>

    <!-- Center -->
    <div class="main">
        <div class="current-q-card">
            <div class="q-big" id="currentQ"></div>
        </div>
        <div class="sample-answer-card">
            <div class="section-header">
                <div class="section-title">Sample Answer</div>
                <div class="answer-controls">
                    <button class="btn-reveal btn-reveal-blanks" id="btnRevealBlanks" onclick="revealAllBlanks()" style="display:none">👁 Reveal All</button>
                    <button class="btn-reveal btn-show-answer" id="btnShowAnswer" onclick="showAnswer()">Show Answer</button>
                </div>
            </div>
            <!-- Placeholder shown before answer is revealed -->
            <div class="answer-placeholder" id="answerPlaceholder">
                <p>✏️ Think about how <em>you</em> would answer first.</p>
                <span>Click "Show Answer" when ready.</span>
            </div>
            <!-- Answer with blanks (shown after clicking Show Answer) -->
            <div class="answer-hidden" id="answerArea">
                <div class="sample-answer" id="sampleAnswer"></div>
                <div class="legend">
                    <div class="legend-item"><span class="legend-dot" style="background:#fef9c3;border:1px solid #fcd34d"></span> High-score phrase — click to reveal</div>
                    <div class="legend-item"><span class="legend-dot" style="background:#dcfce7;border:1px solid #86efac"></span> Collocation — click to reveal</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Right -->
    <div class="dict-panel">
        <div class="dict-header">
            <div class="dict-title">📖 Vocabulary Bank</div>
            <div class="tab-row">
                <div class="tab active" onclick="switchTab('synonyms')">Synonym Swap</div>
                <div class="tab" onclick="switchTab('phrases')">Common Phrases</div>
            </div>
        </div>
        <div id="synonyms" class="tab-content active"></div>
        <div id="phrases" class="tab-content"></div>
    </div>

</div>

let current = data[0];

function makeBlanks(html) {
    // Replace <mark>...</mark> → blank (yellow style)
    html = html.replace(/<mark>(.*?)<\/mark>/g, (_, word) =>
        `<span class="blank" data-word="${word.replace(/"/g,'&quot;')}" onclick="revealBlank(this)">${word}</span>`
    );
    // Replace <span class="colloc">...</span> → blank (green style)
    html = html.replace(/<span class="colloc">(.*?)<\/span>/g, (_, word) =>
        `<span class="blank colloc-blank" data-word="${word.replace(/"/g,'&quot;')}" onclick="revealBlank(this)">${word}</span>`
    );
    return html;
}

function showAnswer() {
    document.getElementById('answerPlaceholder').style.display = 'none';
    document.getElementById('answerArea').classList.remove('answer-hidden');
    document.getElementById('btnShowAnswer').style.display = 'none';
    document.getElementById('btnRevealBlanks').style.display = 'inline-block';
}

function revealBlank(el) {
    el.classList.add('revealed');
}

function revealAllBlanks() {
    document.querySelectorAll('.blank').forEach(b => b.classList.add('revealed'));
    document.getElementById('btnRevealBlanks').textContent = '✓ All Revealed';
    document.getElementById('btnRevealBlanks').disabled = true;
}

function render() {
    // Q list
    document.getElementById('qList').innerHTML = data.map(d => `
        <div class="q-item ${d.id === current.id ? 'active' : ''}" onclick="select('${d.id}')">
            <span class="q-num">${d.id}</span>
            <span class="q-text">${d.q}</span>
        </div>
    `).join('');

    // Reset answer state
    document.getElementById('answerPlaceholder').style.display = '';
    document.getElementById('answerArea').classList.add('answer-hidden');
    document.getElementById('btnShowAnswer').style.display = 'inline-block';
    document.getElementById('btnShowAnswer').textContent = 'Show Answer';
    document.getElementById('btnRevealBlanks').style.display = 'none';
    document.getElementById('btnRevealBlanks').textContent = '👁 Reveal All';
    document.getElementById('btnRevealBlanks').disabled = false;

    // Main
    document.getElementById('currentQ').textContent = current.q;
    document.getElementById('sampleAnswer').innerHTML = makeBlanks(current.sample);

    // Synonyms
    document.getElementById('synonyms').innerHTML = `
        <div class="syn-note">💡 目的是幫你變化表達方式，用同義詞替換來豐富口語回答。</div>
        ${current.synonyms.map(s => `
            <div class="syn-group">
                <div class="syn-keyword">
                    <span class="syn-dot"></span>
                    <span class="syn-word">${s.word}</span>
                    <span class="syn-word-zh">${s.zh}</span>
                </div>
                <div class="syn-tags">${s.tags.map(t => `<span class="syn-tag">${t}</span>`).join('')}</div>
                <div class="syn-example">
                    "${s.example}"
                    <em>${s.exampleZh}</em>
                </div>
            </div>
        `).join('')}
    `;

    // Phrases
    document.getElementById('phrases').innerHTML = current.phrases.map(p => `
        <div class="phrase-card">
            <div class="phrase-top">
                <div class="phrase-word">${p.word}</div>
                <span class="phrase-pos">${p.pos}</span>
            </div>
            <div class="phrase-zh">${p.zh}</div>
            <div class="phrase-def">${p.def}</div>
            <div class="phrase-usage">✅ ${p.usage}</div>
            <div class="phrase-ex-label">Example</div>
            <div class="phrase-ex">"${p.ex}"</div>
            <div class="phrase-ex-zh">${p.exZh}</div>
            <div class="phrase-actions">
                <button class="action-btn" onclick="copy('${p.ex.replace(/'/g,"\\'")}')">📋 Copy</button>
                <button class="action-btn">♡ Save</button>
            </div>
        </div>
    `).join('');
}

function select(id) {
    current = data.find(d => d.id === id);
    render();
}

function switchTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById(name).classList.add('active');
}

function copy(text) {
    navigator.clipboard.writeText(text).catch(() => {});
}

render();
